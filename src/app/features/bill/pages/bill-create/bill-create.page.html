<div class="bill-container-card max-width-container" style="position: relative;">
  <app-loading-spinner 
    *ngIf="isLoading" 
    message="Fetching details from system...">
  </app-loading-spinner>
  <h1 class="page-title">Create New Bill</h1>

  <form [formGroup]="billForm" (ngSubmit)="onSubmit()">
    
    <!-- Customer Details -->
    <div class="form-grid-two">
      <div class="form-field-group">
        <label class="field-label">Customer Name *</label>
        <input type="text" formControlName="customerName" class="form-input"
               [class.input-error]="billForm.get('customerName')?.touched && billForm.get('customerName')?.invalid">
      </div>
      <div class="form-field-group">
        <label class="field-label">Bill Date *</label>
        <input type="date" formControlName="billDate" class="form-input">
      </div>
    </div>

    <!-- Items Grid Table -->
    <div class="items-table-wrapper">
      <div class="items-table-header item-row-grid">
        <div class="span-4">Item Name *</div>
        <div class="span-2">Qty *</div>
        <div class="span-2">Rate *</div>
        <div class="span-2">Discount Rate</div>
        <div class="span-1 text-right">Total</div>
        <div class="span-1 text-center">Action</div>
      </div>

      <div formArrayName="items" class="items-table-body">
        <div *ngFor="let item of itemsFormArray.controls; let i = index" [formGroupName]="i" class="item-row-grid body-row">
          
          <div class="span-4">
            <input type="text" formControlName="itemName" placeholder="Item/Service name" class="form-input-compact"
                   [class.input-error]="item.get('itemName')?.touched && item.get('itemName')?.invalid">
          </div>
          <div class="span-2">
            <input type="number" formControlName="quantity" min="1" class="form-input-compact">
          </div>
          <div class="span-2">
            <input type="number" formControlName="rate" min="0" step="0.01" class="form-input-compact">
          </div>
          <div class="span-2">
            <input type="number" formControlName="discountRate" min="0" step="0.01" class="form-input-compact">
          </div>
          <div class="span-1 text-right font-total">
            {{ calculateRowTotal(i) | currency }}
          </div>
          <div class="span-1 text-center">
            <button type="button" (click)="removeItem(i)" [disabled]="itemsFormArray.length === 1" class="btn-delete-row">
              <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="icon-trash">
                <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.34 9m-4.78 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
              </svg>
            </button>
          </div>

        </div>
      </div>
    </div>

    <!-- Summary Control Panel -->
    <div class="summary-control-bar">
      <button type="button" (click)="addItem()" class="btn-add-item">
        <span>+ Add Row Item</span>
      </button>
      <div class="grand-total-box">
        <span class="label">Grand Total:</span>
        <span class="value">{{ grandTotal | currency }}</span>
      </div>
    </div>

    <!-- Footer Form Submission Actions -->
    <div class="form-action-footer">
      <button type="button" routerLink="/bills" class="btn-cancel">Cancel</button>
      <button type="submit" class="btn-save">Save Bill</button>
    </div>

  </form>
</div>
