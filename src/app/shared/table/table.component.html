  <table class="custom-table">
  <thead>
    <tr class="table-head-row">
      <th *ngFor="let head of headers" class="table-heading">
        {{ head }}
      </th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let list of data" class="table-body-row">
      
      <!-- 1. Pure Data Columns -->
      <td *ngFor="let col of columns" class="table-cell">
        {{ list[col] }}
      </td>

      <!-- 2. Independent Action Column -->
      <td class="action-cell">
        <button (click)="viewDetails(list.billNo)" class="action-btn" title="View Details">
          <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="action-icon">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
          </svg>
        </button>
      </td>

    </tr>
  </tbody>
</table>
